# Jeparla local stack: PostgreSQL 16, Redis 7, S3-compatible storage (MinIO) and the API.
#
#   cp .env.example .env    # then fill in the passwords
#   docker compose up -d --build
#
# Every port is bound to 127.0.0.1 only. Secrets come from .env (gitignored), never from this file.
# Variables are documented in .env.example and README.md.

name: jeparla

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Three roles (#165): the image's superuser (this container only, never the API), the migration role that
    # owns the schema (Flyway) and the API's runtime role, which owns nothing and cannot change the evidence
    # tables. docker/postgres/10-jeparla-roles.sh creates the last two on the first start of an empty volume.
    environment:
      POSTGRES_DB: ${JEPARLA_DB_NAME:-jeparla}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JEPARLA_DB_ADMIN_PASSWORD:?set JEPARLA_DB_ADMIN_PASSWORD in .env}
      JEPARLA_DB_MIGRATION_USER: ${JEPARLA_DB_MIGRATION_USER:-jeparla_owner}
      JEPARLA_DB_MIGRATION_PASSWORD: ${JEPARLA_DB_MIGRATION_PASSWORD:?set JEPARLA_DB_MIGRATION_PASSWORD in .env}
      JEPARLA_DB_USER: ${JEPARLA_DB_USER:-jeparla_app}
      JEPARLA_DB_PASSWORD: ${JEPARLA_DB_PASSWORD:?set JEPARLA_DB_PASSWORD in .env}
      # Store and compare timestamps in UTC (timestamptz columns).
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/10-jeparla-roles.sh:/docker-entrypoint-initdb.d/10-jeparla-roles.sh:ro
    healthcheck:
      # Over TCP: during the first-start initialisation the server listens on its socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Rate-limit counters only (PLAN 3a): the API keeps working without Redis. Every counter expires on its
    # own (TTL = its window). noeviction (#134): a full Redis never drops live counters, which would reset a
    # limit; writes fail instead and the API counts in memory until Redis has room again. Search results are
    # cached in the API's memory (#151), never here, so they cannot crowd the counters out.
    command:
      - redis-server
      - --requirepass
      - ${JEPARLA_REDIS_PASSWORD:?set JEPARLA_REDIS_PASSWORD in .env}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${JEPARLA_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible storage standing in for Cloudflare R2 locally.
  # Upstream MinIO stopped publishing images; pgsty/minio is the maintained community fork
  # (same API, environment variables and bundled `mc` client), multi-arch.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${JEPARLA_S3_ACCESS_KEY:?set JEPARLA_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${JEPARLA_S3_SECRET_KEY:?set JEPARLA_S3_SECRET_KEY in .env (8+ characters)}
      MC_HOST_local: http://${JEPARLA_S3_ACCESS_KEY}:${JEPARLA_S3_SECRET_KEY}@127.0.0.1:9000
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot: creates the public (product images) and private (verification documents) buckets.
  # Idempotent, safe on every `up`.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${JEPARLA_S3_ACCESS_KEY}:${JEPARLA_S3_SECRET_KEY}@minio:9000
      PUBLIC_BUCKET: ${JEPARLA_S3_PUBLIC_BUCKET:-jeparla-public}
      PRIVATE_BUCKET: ${JEPARLA_S3_PRIVATE_BUCKET:-jeparla-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc mb --ignore-existing "local/$$PUBLIC_BUCKET"
        mc mb --ignore-existing "local/$$PRIVATE_BUCKET"
        mc anonymous set download "local/$$PUBLIC_BUCKET"
        mc anonymous set none "local/$$PRIVATE_BUCKET"
        # Photo uploads wait under staging/ until their check (#154); the API's cleanup job deletes the
        # ones never attached, this rule is the backstop (same rule as on R2, backend/README.md).
        echo '{"Rules":[{"ID":"expire-staging","Status":"Enabled","Filter":{"Prefix":"staging/"},"Expiration":{"Days":1}}]}' \
          | mc ilm import "local/$$PRIVATE_BUCKET"
        echo "buckets ready: $$PUBLIC_BUCKET (public read), $$PRIVATE_BUCKET (private, staging/ expires after 1 day)"

  backend:
    build:
      context: ./backend
    image: jeparla-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Hostnames point at the services above; .env keeps the localhost values for running without Docker.
    environment:
      PORT: "8080"
      JEPARLA_FRONTEND_ORIGIN: ${JEPARLA_FRONTEND_ORIGIN:-http://localhost:3000}
      JEPARLA_JWT_SECRET: ${JEPARLA_JWT_SECRET:?set JEPARLA_JWT_SECRET in .env (openssl rand -hex 32)}
      JEPARLA_COOKIE_SECURE: ${JEPARLA_COOKIE_SECURE:-true}
      # No proxy in front locally: only loopback is trusted, published-port clients are keyed by their address.
      JEPARLA_TRUSTED_PROXIES: ${JEPARLA_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
      # Optional shared secret of POST /internal/jobs/metal-prices; empty turns the endpoint off.
      JEPARLA_INTERNAL_JOB_TOKEN: ${JEPARLA_INTERNAL_JOB_TOKEN:-}
      JEPARLA_DB_URL: jdbc:postgresql://postgres:5432/${JEPARLA_DB_NAME:-jeparla}
      # Flyway migrates as the owner; the API runs as the runtime role (#165). No superuser password here.
      JEPARLA_DB_MIGRATION_USER: ${JEPARLA_DB_MIGRATION_USER:-jeparla_owner}
      JEPARLA_DB_MIGRATION_PASSWORD: ${JEPARLA_DB_MIGRATION_PASSWORD}
      JEPARLA_DB_USER: ${JEPARLA_DB_USER:-jeparla_app}
      JEPARLA_DB_PASSWORD: ${JEPARLA_DB_PASSWORD}
      JEPARLA_SUPPORT_EMAIL: ${JEPARLA_SUPPORT_EMAIL:-}
      JEPARLA_SUPPORT_URL: ${JEPARLA_SUPPORT_URL:-}
      JEPARLA_PUBLIC_SITE_URL: ${JEPARLA_PUBLIC_SITE_URL:-http://localhost:3000}
      # Optional SMTP relay of the email outbox (#131); without a host the emails wait in the outbox.
      JEPARLA_SMTP_HOST: ${JEPARLA_SMTP_HOST:-}
      JEPARLA_SMTP_PORT: ${JEPARLA_SMTP_PORT:-587}
      JEPARLA_SMTP_USERNAME: ${JEPARLA_SMTP_USERNAME:-}
      JEPARLA_SMTP_PASSWORD: ${JEPARLA_SMTP_PASSWORD:-}
      JEPARLA_MAIL_FROM: ${JEPARLA_MAIL_FROM:-}
      JEPARLA_REDIS_HOST: redis
      JEPARLA_REDIS_PORT: "6379"
      JEPARLA_REDIS_PASSWORD: ${JEPARLA_REDIS_PASSWORD}
      JEPARLA_S3_ENDPOINT: http://minio:9000
      # Presigned upload URLs are opened by the browser, which reaches MinIO on localhost.
      JEPARLA_S3_PRESIGN_ENDPOINT: ${JEPARLA_S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      JEPARLA_S3_PUBLIC_URL: ${JEPARLA_S3_PUBLIC_URL:-http://localhost:9000/jeparla-public}
      JEPARLA_S3_REGION: ${JEPARLA_S3_REGION:-us-east-1}
      JEPARLA_S3_ACCESS_KEY: ${JEPARLA_S3_ACCESS_KEY}
      JEPARLA_S3_SECRET_KEY: ${JEPARLA_S3_SECRET_KEY}
      JEPARLA_S3_PUBLIC_BUCKET: ${JEPARLA_S3_PUBLIC_BUCKET:-jeparla-public}
      JEPARLA_S3_PRIVATE_BUCKET: ${JEPARLA_S3_PRIVATE_BUCKET:-jeparla-private}
      # Optional error tracking (#56); empty keeps Sentry off.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # The runtime image has bash but no curl: a plain HTTP request over /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres-data:
  redis-data:
  minio-data:
