# --- Seller declaration (#138) ---
# Окончательный текст от 2026-11-16 (#57, docs/legal/analysis.md, раздел 6). Источник: docs/legal/sellers-liability.md, 2b.
# При изменении текста нужна новая DeclarationText.VERSION (сохранённое доказательство связано с версией).
seller.precious.declaration=Подтверждаю, что загруженные документы подлинные, данные о товаре (металл, проба, вес, камни) верны, а на изделии есть требуемое законом пробирное клеймо. Я понимаю, что предоставление поддельных документов или ложных сведений может повлечь ответственность по законодательству Азербайджанской Республики, включая Уголовный кодекс. Jeparla хранит это подтверждение, его время и мой IP-адрес как доказательство, как описано в политике конфиденциальности.

