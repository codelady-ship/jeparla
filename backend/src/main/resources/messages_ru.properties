# Jeparla API messages: ru. Keep in sync with messages.properties (az).
# Messages with arguments go through java.text.MessageFormat: do not use apostrophes.

# --- Error titles and details by HTTP status (ProblemDetail) ---
error.title.default=Ошибка
error.detail.default=Не удалось обработать запрос.

error.title.400=Неверный запрос
error.detail.400=Запрос неверен или не может быть прочитан.
error.title.401=Требуется вход
error.detail.401=Войдите в аккаунт, чтобы выполнить это действие.
error.title.403=Доступ запрещен
error.detail.403=У вас нет прав на это действие.
error.title.404=Не найдено
error.detail.404=Запрошенный ресурс не найден.
error.title.405=Метод не разрешен
error.detail.405=Этот HTTP-метод не поддерживается для данного адреса.
error.title.406=Формат не поддерживается
error.detail.406=Запрошенный формат ответа не поддерживается.
error.title.409=Конфликт
error.detail.409=Запрос противоречит текущему состоянию ресурса.
error.title.413=Слишком большой запрос
error.detail.413=Размер запроса превышает допустимый предел.
error.title.415=Тип содержимого не поддерживается
error.detail.415=Отправленный тип содержимого не поддерживается.
error.title.429=Слишком много запросов
error.detail.429=Слишком много запросов за короткое время. Повторите попытку позже.
error.title.500=Внутренняя ошибка
error.detail.500=Произошла непредвиденная ошибка. Повторите попытку позже.
error.title.503=Сервис недоступен
error.detail.503=Сервис временно недоступен. Повторите попытку позже.

error.validation.detail=Некоторые поля запроса заполнены неверно.

