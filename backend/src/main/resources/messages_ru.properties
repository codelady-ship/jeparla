# Jeparla API messages: ru. Keep in sync with messages.properties (az).
# Messages with arguments go through java.text.MessageFormat: do not use apostrophes.

# --- Error titles and details by HTTP status (ProblemDetail) ---
error.title.default=Ошибка
error.detail.default=Не удалось обработать запрос.

error.title.400=Неверный запрос
error.detail.400=Запрос неверен или не может быть прочитан.
error.title.401=Требуется вход
error.detail.401=Войдите в аккаунт, чтобы выполнить это действие.
error.title.403=Доступ запрещен
error.detail.403=У вас нет прав на это действие.
error.title.404=Не найдено
error.detail.404=Запрошенный ресурс не найден.
error.title.405=Метод не разрешен
error.detail.405=Этот HTTP-метод не поддерживается для данного адреса.
error.title.406=Формат не поддерживается
error.detail.406=Запрошенный формат ответа не поддерживается.
error.title.409=Конфликт
error.detail.409=Запрос противоречит текущему состоянию ресурса.
error.title.413=Слишком большой запрос
error.detail.413=Размер запроса превышает допустимый предел.
error.title.415=Тип содержимого не поддерживается
error.detail.415=Отправленный тип содержимого не поддерживается.
error.title.429=Слишком много запросов
error.detail.429=Слишком много запросов за короткое время. Повторите попытку позже.
error.title.500=Внутренняя ошибка
error.detail.500=Произошла непредвиденная ошибка. Повторите попытку позже.
error.title.503=Сервис недоступен
error.detail.503=Сервис временно недоступен. Повторите попытку позже.

error.validation.detail=Некоторые поля запроса заполнены неверно.

# --- Errors with a code (ProblemDetail "code" property), key = error.<code> ---
error.not_found=Запрошенный ресурс не найден.
error.rate_limited=Слишком много попыток за короткое время. Повторите попытку позже.
error.auth.unauthenticated=Войдите в аккаунт, чтобы выполнить это действие.
error.auth.invalid_token=Срок входа истек или вход недействителен. Войдите снова.
error.auth.forbidden=У вас нет прав на это действие.
error.auth.invalid_credentials=Неверный email, телефон или пароль.
error.auth.account_blocked=Аккаунт заблокирован. Обратитесь в поддержку.
error.auth.email_taken=Аккаунт с этим email уже существует.
error.auth.phone_taken=Аккаунт с этим номером телефона уже существует.
error.auth.refresh_invalid=Сессия истекла. Войдите снова.

# --- Bean Validation constraint messages (resolved by constraint code) ---
# Arguments are the constraint attributes in alphabetical order, starting at {1}.
validation.invalid=Неверное значение.
NotNull=Это поле обязательно.
NotBlank=Это поле не может быть пустым.
NotEmpty=Это поле не может быть пустым.
Size=Длина должна быть от {2} до {1}.
Min=Значение должно быть не меньше {1}.
Max=Значение должно быть не больше {1}.
DecimalMin=Значение должно быть не меньше {2}.
DecimalMax=Значение должно быть не больше {2}.
Positive=Значение должно быть больше нуля.
PositiveOrZero=Значение не может быть отрицательным.
Digits=Число должно содержать не более {2} целых и {1} дробных цифр.
Email=Неверный адрес электронной почты.
Pattern=Неверный формат значения.
typeMismatch=Неверный тип значения.
# Field-specific messages (code.field).
Pattern.password=Пароль должен содержать хотя бы одну букву и одну цифру.
MaxUtf8Bytes=Значение слишком длинное.
MaxUtf8Bytes.password=Пароль слишком длинный.
AzMobilePhone=Введите азербайджанский мобильный номер, например +994 50 123 45 67.
