# --- Bean Validation constraint messages (resolved by constraint code) ---
# Arguments are the constraint attributes in alphabetical order, starting at {1}.
validation.invalid=Неверное значение.
NotNull=Это поле обязательно.
NotBlank=Это поле не может быть пустым.
NotEmpty=Это поле не может быть пустым.
Size=Длина должна быть от {2} до {1}.
Min=Значение должно быть не меньше {1}.
Max=Значение должно быть не больше {1}.
DecimalMin=Значение должно быть не меньше {2}.
DecimalMax=Значение должно быть не больше {2}.
Positive=Значение должно быть больше нуля.
PositiveOrZero=Значение не может быть отрицательным.
Digits=Число должно содержать не более {2} целых и {1} дробных цифр.
Email=Неверный адрес электронной почты.
Pattern=Неверный формат значения.
typeMismatch=Неверный тип значения.
# Field-specific messages (code.field).
Pattern.password=Пароль должен содержать хотя бы одну букву и одну цифру.
MaxUtf8Bytes=Значение слишком длинное.
MaxUtf8Bytes.password=Пароль слишком длинный.
AzMobilePhone=Введите азербайджанский мобильный номер, например +994 50 123 45 67.
