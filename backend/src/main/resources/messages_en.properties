# --- Seller declaration (#138) ---
# DRAFT until a lawyer approves it (#57). Source: docs/legal/sellers-liability.md, section 2b.
# A change of the text needs a new DeclarationText.VERSION (the stored evidence is tied to the version).
seller.precious.declaration=I confirm that the documents I upload are genuine, the product details (metal, fineness, weight, stones) are accurate, and the item bears the assay hallmark required by law. I understand that submitting false documents or false information may lead to liability under the legislation of the Republic of Azerbaijan, including the Criminal Code.

# --- Document review reasons (docs/legal/sellers-liability.md, 2c) ---
verification.reason.UNREADABLE=The document is unreadable or incomplete
verification.reason.EXPIRED=The document has expired
verification.reason.MISMATCH=The document does not match the product or store details
verification.reason.WRONG_TYPE=This document type does not meet the requirement
verification.reason.HALLMARK_MISSING=The assay hallmark is not visible or cannot be confirmed
verification.reason.AUTHENTICITY=We could not confirm the document is authentic

# --- Notifications (#138), arguments as in messages.properties ---
notification.note=Note from the review team: {0}
notification.email.footer=This email was sent automatically by Jeparla. All notifications are in your dashboard.
notification.support=Support: {0}
notification.support.help=Support: the help page on the site, {0}
notification.document_approved.title=Document approved
notification.document_approved.body=Your document passed the review. Thank you.\n\nDocument: {1}, {2}.
notification.document_rejected.title=Document not accepted
notification.document_rejected.body=Unfortunately, we could not accept your document. Reason: {0}. Because of this, the product (store) will not be published for now. You can upload a correct document from your dashboard; it will be published once verified. If you have questions, contact support.\n\nDocument: {1}, {2}.
notification.document_changes_requested.title=Your document needs a correction
notification.document_changes_requested.body=We reviewed your document, but it needs a correction before we can accept it. Reason: {0}. Please upload a corrected or another suitable document from your dashboard; the product (store) will be published once it is verified. If you have questions, contact support.\n\nDocument: {1}, {2}.
notification.product_approved.title=Product published
notification.product_approved.body="{0}" passed the review and is now shown on the site.
notification.product_returned.title=Product returned for changes
notification.product_returned.body="{0}" will not be published for now. Reason: {1}. You can edit the product in your dashboard and send it for review again. If you have questions, contact support.
notification.product_deactivated.title=Product taken down
notification.product_deactivated.body="{0}" is no longer shown on the site. Reason: {1}. If you have questions, contact support.
notification.store_approved.title=Store approved
notification.store_approved.body=The store "{0}" has been approved.
notification.store_rejected.title=Store application not accepted
notification.store_rejected.body=Unfortunately, we could not accept the application of the store "{0}". Reason: {1}. You can correct the details and contact support.
notification.store_blocked.title=Store temporarily suspended
notification.store_blocked.body=The store "{0}" is temporarily not shown on the site. Reason: {1}. If you have questions, contact support.
notification.seller_verified.title=Seller check completed
notification.seller_verified.body=The seller check of the store "{0}" has been completed.
notification.seller_rejected.title=Seller check not completed
notification.seller_rejected.body=Unfortunately, we could not confirm the seller details of the store "{0}". Reason: {1}. You can correct the details and contact support.
notification.report_resolved.title=A buyer complaint was reviewed
notification.report_resolved.body=We reviewed a buyer complaint about "{0}" and found it justified. Please check and correct the details. If you have questions, contact support.

# --- Account emails with a one-time link (#131): {0} link, {1} hours (verify) or minutes (reset) ---
email.account.footer=This email was sent automatically by Jeparla. Never forward this link to anyone.
email.verify_email.subject=Jeparla: confirm your email address
email.verify_email.body=Hello!\n\nOpen this link to confirm the email address of your Jeparla account:\n{0}\n\nThe link works once and for {1} hours. If you did not sign up on Jeparla, ignore this email.
email.reset_password.subject=Jeparla: reset your password
email.reset_password.body=Hello!\n\nSomeone asked to reset the password of your Jeparla account. Open this link to set a new password:\n{0}\n\nThe link works once and for {1} minutes. Setting a new password signs you out on every device. If you did not ask for this, ignore this email: your password has not changed.

