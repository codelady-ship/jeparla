# Jeparla API messages: en. Keep in sync with messages.properties (az).
# Messages with arguments go through java.text.MessageFormat: do not use apostrophes.

# --- Error titles and details by HTTP status (ProblemDetail) ---
error.title.default=Error
error.detail.default=The request could not be processed.

error.title.400=Bad request
error.detail.400=The request is invalid or cannot be read.
error.title.401=Sign-in required
error.detail.401=Sign in to your account to perform this action.
error.title.403=Forbidden
error.detail.403=You do not have permission to perform this action.
error.title.404=Not found
error.detail.404=The requested resource was not found.
error.title.405=Method not allowed
error.detail.405=This HTTP method is not supported for this address.
error.title.406=Not acceptable
error.detail.406=The requested response format is not supported.
error.title.409=Conflict
error.detail.409=The request conflicts with the current state of the resource.
error.title.413=Request too large
error.detail.413=The request size exceeds the allowed limit.
error.title.415=Unsupported media type
error.detail.415=The submitted content type is not supported.
error.title.429=Too many requests
error.detail.429=Too many requests in a short time. Please try again later.
error.title.500=Internal error
error.detail.500=An unexpected error occurred. Please try again later.
error.title.503=Service unavailable
error.detail.503=The service is temporarily unavailable. Please try again later.

error.validation.detail=Some fields in the request are invalid.

