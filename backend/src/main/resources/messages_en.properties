# Jeparla API messages: en. Keep in sync with messages.properties (az).
# Messages with arguments go through java.text.MessageFormat: do not use apostrophes.

# --- Error titles and details by HTTP status (ProblemDetail) ---
error.title.default=Error
error.detail.default=The request could not be processed.

error.title.400=Bad request
error.detail.400=The request is invalid or cannot be read.
error.title.401=Sign-in required
error.detail.401=Sign in to your account to perform this action.
error.title.403=Forbidden
error.detail.403=You do not have permission to perform this action.
error.title.404=Not found
error.detail.404=The requested resource was not found.
error.title.405=Method not allowed
error.detail.405=This HTTP method is not supported for this address.
error.title.406=Not acceptable
error.detail.406=The requested response format is not supported.
error.title.409=Conflict
error.detail.409=The request conflicts with the current state of the resource.
error.title.413=Request too large
error.detail.413=The request size exceeds the allowed limit.
error.title.415=Unsupported media type
error.detail.415=The submitted content type is not supported.
error.title.429=Too many requests
error.detail.429=Too many requests in a short time. Please try again later.
error.title.500=Internal error
error.detail.500=An unexpected error occurred. Please try again later.
error.title.503=Service unavailable
error.detail.503=The service is temporarily unavailable. Please try again later.

error.validation.detail=Some fields in the request are invalid.

# --- Errors with a code (ProblemDetail "code" property), key = error.<code> ---
error.not_found=The requested resource was not found.
error.rate_limited=Too many attempts in a short time. Please try again later.
error.auth.unauthenticated=Sign in to your account to perform this action.
error.auth.invalid_token=Your sign-in has expired or is invalid. Please sign in again.
error.auth.forbidden=You do not have permission to perform this action.
error.auth.invalid_credentials=The email, phone or password is incorrect.
error.auth.account_blocked=This account is blocked. Please contact support.
error.auth.email_taken=An account with this email already exists.
error.auth.phone_taken=An account with this phone number already exists.
error.auth.refresh_invalid=Your session has expired. Please sign in again.
error.catalog.invalid_range=The minimum must not be greater than the maximum.

# --- Bean Validation constraint messages (resolved by constraint code) ---
# Arguments are the constraint attributes in alphabetical order, starting at {1}.
validation.invalid=The value is invalid.
NotNull=This field is required.
NotBlank=This field must not be blank.
NotEmpty=This field must not be empty.
Size=Length must be between {2} and {1}.
Min=Value must be {1} or greater.
Max=Value must be {1} or less.
DecimalMin=Value must be {2} or greater.
DecimalMax=Value must be {2} or less.
Positive=Value must be greater than zero.
PositiveOrZero=Value must not be negative.
Digits=Number must have at most {2} integer and {1} fraction digits.
Email=The email address is invalid.
Pattern=The value has an invalid format.
typeMismatch=The value has the wrong type.
# Field-specific messages (code.field).
Pattern.password=The password must contain at least one letter and one digit.
MaxUtf8Bytes=The value is too long.
MaxUtf8Bytes.password=The password is too long.
AzMobilePhone=Enter an Azerbaijani mobile number, e.g. +994 50 123 45 67.
