# Jeparla API configuration.
# Secrets and environment-specific values come only from environment variables.
# PostgreSQL is required: Flyway applies db/migration at startup, then Hibernate validates the
# JPA entities against the schema (#33).

spring:
  application:
    name: jeparla-backend
  messages:
    basename: messages
    encoding: UTF-8
    # Never fall back to the server OS locale: az is the default via messages.properties.
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${JEPARLA_DB_URL:jdbc:postgresql://localhost:5432/jeparla}
    # Runtime role (#165): not a superuser, owns nothing; SELECT and INSERT only on the evidence tables
    # (V16). DatabaseRoleCheck stops the API at startup when it connects with more rights than that.
    username: ${JEPARLA_DB_USER:jeparla_app}
    password: ${JEPARLA_DB_PASSWORD:}
    hikari:
      # Small pool: the API, PostgreSQL and Redis share one free-tier VM.
      maximum-pool-size: 10
      # Search (#151): the word-similarity operator (%>) of the GIN-indexed pre-filter uses this threshold.
      # It is SearchSql.PREFILTER_THRESHOLD, a little below the 0.5 of the score, so the index finds every
      # typo match; the exact word_similarity check then runs on those rows only. Must stay <= 0.5.
      connection-init-sql: SET pg_trgm.word_similarity_threshold = 0.45
  data:
    redis:
      # Rate-limit counters only (#34): search results are cached in the API (#151), so nothing else
      # competes with the counters for Redis memory (docker-compose.yml: noeviction). The API keeps
      # working without Redis.
      host: ${JEPARLA_REDIS_HOST:localhost}
      port: ${JEPARLA_REDIS_PORT:6379}
      password: ${JEPARLA_REDIS_PASSWORD:}
      # Fail fast: while Redis is down, rate limiting falls back to in-memory counters.
      connect-timeout: 500ms
      timeout: 500ms
      repositories:
        enabled: false
  flyway:
    locations: classpath:db/migration
    # Migration role (#165): owns the schema; only Flyway connects with it, on the datasource URL.
    user: ${JEPARLA_DB_MIGRATION_USER:jeparla_owner}
    password: ${JEPARLA_DB_MIGRATION_PASSWORD:}
    placeholders:
      # V16 grants the runtime role its rights; it must exist and differ from the migration role.
      runtimerole: ${spring.datasource.username}
    # Never wipe a database from the application.
    clean-disabled: true
    validate-migration-naming: true
  jpa:
    # Entities are read and changed inside @Transactional services, never while rendering a response.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Lazy collections and proxies are loaded in batches (IN lists), so a catalog page costs a
        # fixed number of statements (no N+1).
        default_batch_fetch_size: 100

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Forwarding headers are handled only by ClientIpFilter (jeparla.client-ip below), which believes
  # them from trusted proxies only. "framework" (Spring's ForwardedHeaderFilter) would trust any
  # sender and prefer a client's own Forwarded header (#132).
  forward-headers-strategy: none
  error:
    include-stacktrace: never
    include-message: never

jeparla:
  cors:
    # Comma-separated list of exact frontend origins. "*" is rejected at startup.
    allowed-origins: ${JEPARLA_FRONTEND_ORIGIN:http://localhost:3000}
  client-ip:
    # Reverse proxies (CIDR, comma-separated) whose X-Forwarded-For names the client. Requests from
    # anyone else are keyed by their TCP peer address. Empty: trust nothing. In production set it to
    # the Caddy container network (backend/README.md, "Reverse proxy").
    trusted-proxies: ${JEPARLA_TRUSTED_PROXIES:127.0.0.1/32,::1/128}
    # Shared secret of the frontend server (32+ bytes): with it, X-Jeparla-Client-Ip names the visitor
    # the Next.js server calls the API for (sign-in, search). Empty: the header is ignored (#41).
    frontend-token: ${JEPARLA_FRONTEND_TOKEN:}
  auth:
    # HS256 key of the access tokens, 32+ bytes (openssl rand -hex 32). Required: no default.
    jwt-secret: ${JEPARLA_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # Absolute lifetime of a session (refresh token family, #134): rotation never extends it past this.
    refresh-family-ttl: 90d
    cookie-secure: ${JEPARLA_COOKIE_SECURE:true}
    # Email verification and password reset links (#131): one use each, only the SHA-256 hash is stored.
    account-email:
      verification-ttl: 24h
      reset-ttl: 1h
      # Every "forgot password" answer takes at least this long, account or not.
      forgot-response-floor: 400ms
      # Deletes expired tokens and removes expired links from the email outbox. "-" turns it off.
      cleanup-cron: ${JEPARLA_ACCOUNT_TOKEN_CLEANUP_CRON:0 40 * * * *}
  storage:
    # Base URL of the public bucket for image URLs (JEPARLA_S3_PUBLIC_URL). Demo images (demo/...)
    # do not need it: they are served by the frontend from /demo.
    public-url: ${JEPARLA_S3_PUBLIC_URL:}
    # S3-compatible API for product photo uploads (#39): presigned PUT URLs, then a check of the stored
    # file. Without endpoint, keys and bucket the upload endpoints answer 503 and everything else works.
    s3:
      endpoint: ${JEPARLA_S3_ENDPOINT:}
      # Endpoint in presigned URLs, as the browser reaches it (default: endpoint).
      presign-endpoint: ${JEPARLA_S3_PRESIGN_ENDPOINT:}
      region: ${JEPARLA_S3_REGION:us-east-1}
      access-key: ${JEPARLA_S3_ACCESS_KEY:}
      secret-key: ${JEPARLA_S3_SECRET_KEY:}
      public-bucket: ${JEPARLA_S3_PUBLIC_BUCKET:jeparla-public}
      # Private bucket: uploads wait under staging/ until their check and only then are copied to the
      # public bucket (#154); verification documents (#40). Must differ from the public bucket.
      private-bucket: ${JEPARLA_S3_PRIVATE_BUCKET:jeparla-private}
  merchant:
    images:
      # Presigned photo uploads per store in 24 hours, attached or not (#154). Per seller account the
      # rate-limit policy image-upload-account applies (60 per hour).
      daily-uploads-per-store: 300
      # Deletes staged uploads that were never attached (ShedLock). "-" turns the schedule off.
      cleanup-cron: ${JEPARLA_UPLOAD_CLEANUP_CRON:0 7/30 * * * *}
      cleanup-lock-at-most-for: 15m
  ai:
    # AI Studio (#55, docs/ai-providers.md). "none": no provider, AI Studio shows "not configured" and job
    # requests answer 503. Another value must be the id of an installed provider bean, or the API does not start.
    # Provider keys are read by the provider from its own env variables, never from this file.
    image-provider: ${JEPARLA_AI_IMAGE_PROVIDER:none}
    # #119: processor of STUDIO_LOOK jobs (background removal, cream background, shadow, 4:5). "none": the studio
    # look option is shown as not configured. It must not generate; a local one has the daily quota only.
    studio-processor: ${JEPARLA_AI_STUDIO_PROCESSOR:none}
    # Jobs and retries per store and day (Asia/Baku); per seller account also the rate-limit policy ai-job-account.
    daily-jobs-per-store: ${JEPARLA_AI_DAILY_JOBS_PER_STORE:10}
    max-attempts: 3
    # Hard limit of the provider cost of all stores per calendar month, in cost-currency. 0 (the default) starts
    # nothing even with a provider: the owner sets the budget explicitly. Set a spending cap at the provider too.
    monthly-cost-limit: ${JEPARLA_AI_MONTHLY_COST_LIMIT:0}
    cost-currency: ${JEPARLA_AI_COST_CURRENCY:USD}
    attempt-timeout: 5m
    result-url-ttl: 10m
    # #121: queue an on-model (VIRTUAL_TRY_ON) job by itself when a product gets its first original photo. Off by
    # default; it still needs a provider, quota and budget, and the result still waits for the seller's approval.
    auto-try-on: ${JEPARLA_AI_AUTO_TRY_ON:false}
    worker-delay: 15s
  verification:
    documents:
      # Verification documents of precious sellers (#40): private bucket only. Per seller account the
      # rate-limit policy document-upload-account applies (20 per hour).
      open-uploads-per-store: 10
      daily-uploads-per-store: 50
      # Life of the presigned URL an admin opens a document with (every view is audited).
      view-url-ttl: 5m
      cleanup-lock-at-most-for: 15m
  support:
    # Contact at the end of every notification that asks the seller to contact support (#138), also in the
    # email. Empty both: the help page is named instead, /{lang}/help in the app and its absolute URL on
    # site-url in the email (#167).
    email: ${JEPARLA_SUPPORT_EMAIL:}
    url: ${JEPARLA_SUPPORT_URL:}
    help-path: /help
    # Public origin of the frontend (no path) for the links in emails, e.g. https://jeparla.az. Also the base of
    # a store's share link <site-url>/s/<code> and its QR code (#100).
    site-url: ${JEPARLA_PUBLIC_SITE_URL:http://localhost:3000}
  notifications:
    # Sends the email outbox (#138) once a provider is configured (#131); "-" turns the schedule off.
    email-cron: ${JEPARLA_EMAIL_OUTBOX_CRON:0 * * * * *}
  mail:
    # SMTP relay of the email outbox (#131, docs/deploy.md "Email"). Empty host: nothing is sent, the outbox
    # keeps the messages. STARTTLS is required.
    host: ${JEPARLA_SMTP_HOST:}
    port: ${JEPARLA_SMTP_PORT:587}
    username: ${JEPARLA_SMTP_USERNAME:}
    password: ${JEPARLA_SMTP_PASSWORD:}
    from: ${JEPARLA_MAIL_FROM:}
  metal-prices:
    # Daily CBAR bulletin (#43): bank metals XAU/XAG/XPT/XPD in AZN per troy ounce. On weekends and
    # holidays CBAR answers with the last bulletin (its own date), which is already stored.
    source-url: https://www.cbar.az/currencies/{date}.xml
    # Names the service, no personal contact.
    user-agent: "Jeparla/1.0 (metal price service; +https://jeparla.az)"
    zone: Asia/Baku
    # Three runs a day after CBAR publishes (10:15, 13:15, 17:15 Baku); the bulletin of a day is
    # stored once, so the later runs are no-ops. JEPARLA_METAL_PRICES_CRON=- turns the schedule off.
    cron: ${JEPARLA_METAL_PRICES_CRON:0 15 10,13,17 * * *}
    connect-timeout: 5s
    read-timeout: 20s
    attempts: 3
    backoff: 30s
    # PLAN 5.10: a daily change above 10% is never applied without an admin.
    max-daily-change-percent: 10
    batch-size: 200
    lock-at-most-for: 30m
    lock-at-least-for: 1m
  internal:
    # Shared secret of POST /internal/jobs/metal-prices (header X-Jeparla-Job-Token), 32+ bytes.
    # Empty: the endpoint answers 404.
    job-token: ${JEPARLA_INTERNAL_JOB_TOKEN:}
  search:
    cache:
      # Ranked search results and header suggestions per query (#151), in the API's memory. Emptied when a
      # product, variant, store, category or synonym changes; 0s turns the cache off.
      ttl: 60s
      max-entries: 5000
  rate-limit:
    # redis (shared counters, in-memory fallback while Redis is down) or memory.
    store: redis
    # Defaults are in RateLimitPolicy; override one with e.g.
    # policies.login-ip.limit: 20 and policies.login-ip.window: 5m

# Error tracking (#56). Without SENTRY_DSN (local, tests, CI) the SDK stays off. send-default-pii: false keeps
# IPs, cookies, headers and user ids out of events; request bodies are never attached (seller documents,
# passwords). Only unhandled errors are sent: no performance tracing, no logs.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  traces-sample-rate: 0.0
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      # Redis is optional (PLAN 3a): its outage must not mark the API as down.
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  # Off by default, so production never publishes the API description (#134); JEPARLA_API_DOCS=true turns
  # both on locally. Off, the paths answer 404.
  api-docs:
    enabled: ${JEPARLA_API_DOCS:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${JEPARLA_API_DOCS:false}
    path: /swagger-ui.html
  paths-to-match: /api/**
