# Test-only settings, loaded on top of src/main/resources/application.yml.
# The JWT key below is a placeholder for tests (32+ bytes, deliberately not random): production
# reads JEPARLA_JWT_SECRET from the environment and has no default.
jeparla:
  auth:
    jwt-secret: test-test-test-test-test-test-test-test
  # Public bucket URL for image URLs of non-demo keys (as in docker-compose.yml).
  storage:
    public-url: http://localhost:9000/jeparla-public
  # Tests change the catalog with SQL inside rolled-back transactions; a cached search would hide that.
  # SearchCacheTests covers the cache itself.
  search:
    cache:
      ttl: 0s
  # Tests without a Redis container count in memory; @AuthIntegrationTest switches to Redis.
  rate-limit:
    store: memory
  # No scheduled runs and no calls to cbar.az in tests: job tests start it themselves against a local
  # stub (support/CbarStub), without waiting between retries.
  # Upload cleanup tests start the job themselves.
  merchant:
    images:
      cleanup-cron: "-"
  metal-prices:
    cron: "-"
    source-url: http://127.0.0.1:9/currencies/{date}.xml
    backoff: 0s
    connect-timeout: 2s
    read-timeout: 5s

# The OpenAPI contract tests read /v3/api-docs; ApiDocsOffTests checks the production default (off).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
