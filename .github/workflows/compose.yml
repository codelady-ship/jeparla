name: compose

# Local stack check (#31): docker-compose.yml is valid against .env.example and the stack
# (PostgreSQL, Redis, MinIO, bucket init, API) starts and turns healthy.
on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker/**"
      - ".env.example"
      - "backend/**"
      - ".github/workflows/compose.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker/**"
      - ".env.example"
      - "backend/**"
      - ".github/workflows/compose.yml"

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    name: docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Throwaway CI-only values for the variables .env.example leaves empty.
      - name: Create .env from .env.example
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^JEPARLA_DB_ADMIN_PASSWORD=$/JEPARLA_DB_ADMIN_PASSWORD=ci$(openssl rand -hex 12)/" \
            -e "s/^JEPARLA_DB_MIGRATION_PASSWORD=$/JEPARLA_DB_MIGRATION_PASSWORD=ci$(openssl rand -hex 12)/" \
            -e "s/^JEPARLA_DB_PASSWORD=$/JEPARLA_DB_PASSWORD=ci$(openssl rand -hex 12)/" \
            -e "s/^JEPARLA_REDIS_PASSWORD=$/JEPARLA_REDIS_PASSWORD=ci$(openssl rand -hex 12)/" \
            -e "s/^JEPARLA_JWT_SECRET=$/JEPARLA_JWT_SECRET=$(openssl rand -hex 32)/" \
            -e "s/^JEPARLA_S3_ACCESS_KEY=$/JEPARLA_S3_ACCESS_KEY=ci$(openssl rand -hex 6)/" \
            -e "s/^JEPARLA_S3_SECRET_KEY=$/JEPARLA_S3_SECRET_KEY=ci$(openssl rand -hex 16)/" \
            .env
          if grep -E '^[A-Z_]+=$' .env; then echo "unfilled variable in .env"; exit 1; fi

      - name: Validate compose file
        run: docker compose config -q

      - name: Missing secrets are refused
        run: |
          if docker compose --env-file .env.example config -q 2>/dev/null; then
            echo "compose accepted empty passwords"; exit 1
          fi

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness; then echo; break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"UP"'
          docker compose ps -a

      - name: Services are healthy and buckets exist
        run: |
          for s in postgres redis minio backend; do
            for i in $(seq 1 12); do
              state=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "$s")")
              [ "$state" = healthy ] && break
              sleep 5
            done
            echo "$s: $state"
            [ "$state" = healthy ] || exit 1
          done
          code=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q minio-init)")
          echo "minio-init exit code: $code"
          [ "$code" = 0 ]
          docker compose exec -T minio mc ls local
          # Uploads never attached expire from the private bucket's staging/ prefix (#154).
          docker compose exec -T minio mc ilm rule ls local/jeparla-private | tee /dev/stderr | grep -q 'staging/'

      # #165: the API connects as a role that is no superuser, owns nothing and cannot remove evidence.
      - name: Database roles are least privilege
        run: |
          set -a; . ./.env; set +a
          sql() { docker compose exec -T -e PGPASSWORD="$2" postgres \
            psql -h 127.0.0.1 -U "$1" -d "$JEPARLA_DB_NAME" -v ON_ERROR_STOP=1 -tAc "$3"; }
          echo "API connects as: $(docker compose exec -T backend printenv JEPARLA_DB_USER)"
          [ "$(docker compose exec -T backend printenv JEPARLA_DB_USER | tr -d '\r')" = "$JEPARLA_DB_USER" ]
          [ "$(sql "$JEPARLA_DB_USER" "$JEPARLA_DB_PASSWORD" "SELECT rolsuper FROM pg_roles WHERE rolname = current_user")" = f ]
          [ "$(sql "$JEPARLA_DB_USER" "$JEPARLA_DB_PASSWORD" \
            "SELECT tableowner FROM pg_tables WHERE tablename = 'seller_declarations'")" = "$JEPARLA_DB_MIGRATION_USER" ]
          for statement in \
            "TRUNCATE seller_declarations" \
            "TRUNCATE audit_logs" \
            "DELETE FROM seller_declarations" \
            "UPDATE audit_logs SET reason = NULL" \
            "ALTER TABLE seller_declarations DISABLE TRIGGER ALL" \
            "SET session_replication_role = replica"; do
            if sql "$JEPARLA_DB_USER" "$JEPARLA_DB_PASSWORD" "$statement" >/dev/null 2>&1; then
              echo "runtime role was allowed: $statement"; exit 1
            fi
            echo "refused as expected: $statement"
          done
          # The migration role is no superuser either.
          [ "$(sql "$JEPARLA_DB_MIGRATION_USER" "$JEPARLA_DB_MIGRATION_PASSWORD" \
            "SELECT rolsuper FROM pg_roles WHERE rolname = current_user")" = f ]

      # #134: a full Redis refuses writes (the API then counts in memory) instead of evicting live counters.
      - name: Redis never evicts rate-limit counters
        run: |
          r() { docker compose exec -T redis redis-cli "$@" | tr -d '\r'; }
          [ "$(r CONFIG GET maxmemory-policy | tail -n 1)" = noeviction ]
          r SET jeparla:rl:ci-probe 1 EX 600
          r CONFIG SET maxmemory 2mb
          filler=$(head -c 100000 /dev/zero | tr '\0' x)
          refused=0
          for i in $(seq 1 60); do
            out=$(r SET "ci-filler:$i" "$filler" EX 600 2>&1 || true)
            case "$out" in *OOM*) refused=1; break ;; esac
          done
          echo "write refused when full: $refused"
          [ "$refused" = 1 ]
          [ "$(r EXISTS jeparla:rl:ci-probe)" = 1 ]
          r CONFIG SET maxmemory 128mb

      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
