name: metal prices check

# Daily guard of the metal price job (#44). The job itself runs inside the API (cron 10:15, 13:15,
# 17:15 Asia/Baku); this workflow only checks the result from outside:
#   1. reads GET /api/v1/metal-prices/latest of the deployed API (repository variable JEPARLA_API_URL);
#   2. compares the oldest quote date with the date of the CBAR bulletin in force today (fallback when
#      cbar.az cannot be reached: older than 4 days is stale);
#   3. if stale, calls POST /internal/jobs/metal-prices (secret JEPARLA_INTERNAL_JOB_TOKEN) and reads
#      again;
#   4. opens an issue (once; an open one is reused) when the prices are still stale or a quote waits
#      for an admin (held by the sanity check, PLAN 5.10), and fails the run.
# Without JEPARLA_API_URL (nothing deployed yet) it does nothing.
on:
  schedule:
    # 10:30 UTC = 14:30 in Baku, after the 13:15 run.
    - cron: "30 10 * * *"
  workflow_dispatch:

concurrency:
  group: metal-prices-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: latest metal prices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ vars.JEPARLA_API_URL }}
      JOB_TOKEN: ${{ secrets.JEPARLA_INTERNAL_JOB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      USER_AGENT: "Jeparla/1.0 (metal price check; +https://jeparla.az)"
    steps:
      - name: Check, re-run if stale, alert
        run: |
          set -euo pipefail
          if [ -z "${API_URL}" ]; then
            echo "::notice::Repository variable JEPARLA_API_URL is not set: nothing to check."
            exit 0
          fi
          api="${API_URL%/}"

          # Oldest quote date over the four metals (YYYY-MM-DD), empty when there is none.
          oldest_quote() {
            curl -fsS --max-time 30 "${api}/api/v1/metal-prices/latest" \
              | jq -r 'if length == 4 then (map(.date) | min) else "" end'
          }

          # Business date of the CBAR bulletin in force today (YYYY-MM-DD), empty when unreachable.
          today=$(TZ=Asia/Baku date +%d.%m.%Y)
          cbar=$(curl -fsS --max-time 30 -A "${USER_AGENT}" "https://www.cbar.az/currencies/${today}.xml" \
            | grep -o 'ValCurs Date="[0-9.]*"' | head -n 1 \
            | sed -E 's/.*"([0-9]{2})\.([0-9]{2})\.([0-9]{4})"/\3-\2-\1/' || true)
          limit=${cbar:-$(TZ=Asia/Baku date -d '4 days ago' +%F)}
          echo "CBAR bulletin in force: ${cbar:-unknown}; prices must be from ${limit} or later."

          is_stale() { [ -z "$1" ] || [[ "$1" < "${limit}" ]]; }

          quote=$(oldest_quote)
          echo "Oldest quote in use: ${quote:-none}"
          held="[]"
          if is_stale "${quote}"; then
            if [ -z "${JOB_TOKEN}" ]; then
              echo "::warning::Prices are stale and secret JEPARLA_INTERNAL_JOB_TOKEN is not set: cannot re-run the job."
            else
              echo "Prices are stale: running the job."
              status=$(curl -sS --max-time 300 -o report.json -w '%{http_code}' -X POST \
                -H "X-Jeparla-Job-Token: ${JOB_TOKEN}" "${api}/internal/jobs/metal-prices" || echo "000")
              echo "Job answered HTTP ${status}"
              if [ "${status}" = "200" ]; then
                jq '{requestedDate, bulletinDate, fetchError, heldMetals, total}' report.json
                held=$(jq -c '.heldMetals' report.json)
              fi
              quote=$(oldest_quote)
              echo "Oldest quote in use after the run: ${quote:-none}"
            fi
          fi

          problem=""
          if is_stale "${quote}"; then
            problem="Metal qiymətləri köhnədir: ən köhnə qiymət ${quote:-yoxdur}, AMB bülleteni ${cbar:-əlçatan deyil}."
          fi
          if [ "${held}" != "[]" ]; then
            problem="${problem} Admin təsdiqi gözləyən qiymət: ${held} (gündəlik dəyişmə həddən böyükdür)."
          fi
          if [ -z "${problem}" ]; then
            echo "Metal prices are up to date."
            exit 0
          fi

          title="Metal qiyməti yenilənmir və ya təsdiq gözləyir"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf '%s\n\nYoxlama: %s\n\nAdmin panelində (Metal qiymətləri) gözləyən qiyməti təsdiqləyin və ya rədd edin; bülleten gəlmirsə API loglarında `Metal price job` sətrinə baxın. Səhv qiymət S1 sayılır (PLAN 5.10).' "${problem}" "${run_url}")
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "in:title \"${title}\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi
          echo "::error::${problem}"
          exit 1
